<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Certificate Verification</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f6fb;color:#1f2430}
  .wrap{max-width:480px;margin:0 auto;padding:24px 16px}
  h1{font-size:22px;margin:8px 0 18px}
  .card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 1px 6px rgba(0,0,0,.08)}
  .badge{padding:14px;border-radius:8px;font-size:20px;font-weight:bold;margin-bottom:8px}
  .ok{background:#e6f4ea;color:#137333}
  .bad{background:#fce8e6;color:#c5221f}
  .wait{background:#eef1f8;color:#444}
  .lbl{margin:16px 0 0;color:#666;font-size:13px}
  .val{margin:2px 0 0;font-size:18px;font-weight:bold;word-break:break-word}
  .note{margin-top:22px;color:#666;font-size:13px;line-height:1.5}
  form{display:flex;gap:8px;margin-top:6px}
  input{flex:1;padding:12px;font-size:16px;border:1px solid #c5cad6;border-radius:8px;text-transform:uppercase}
  button{padding:12px 16px;font-size:16px;border:0;border-radius:8px;background:#2a5bd7;color:#fff}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>Certificate Verification</h1>
  <div class="card">
    <div id="result"></div>
    <form id="manual" class="hidden">
      <input id="idbox" placeholder="Certificate ID, जैसे EVT26-ABC123" autocomplete="off">
      <button type="submit">Verify</button>
    </form>
    <p class="note" id="footnote"></p>
  </div>
</div>

<script>
// ====== सिर्फ यही एक लाइन बदलनी हो सकती है ======
// Apps Script का Web app URL (जो /exec पर खत्म होता है)
var API_URL = 'https://script.google.com/macros/s/AKfycbxttNpb5zOlHlmRIaZ8KY0POEjw_NO0-MpSjLqrMEvZ8uL7PSCmeu74rqDE7KIItvkAVw/exec';

var resultEl = document.getElementById('result');
var form = document.getElementById('manual');
var box = document.getElementById('idbox');
var foot = document.getElementById('footnote');

function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function show(kind, title, rows, msg) {
  resultEl.innerHTML = '';
  resultEl.appendChild(el('div', 'badge ' + kind, title));
  if (msg) resultEl.appendChild(el('p', '', msg));
  (rows || []).forEach(function (r) {
    resultEl.appendChild(el('p', 'lbl', r[0]));
    resultEl.appendChild(el('p', 'val', r[1]));
  });
}

function verify(id) {
  id = (id || '').trim().toUpperCase();
  if (!id) {
    show('wait', 'Certificate ID डालिए', null, 'सर्टिफिकेट का QR स्कैन करें या नीचे ID लिखें।');
    form.classList.remove('hidden');
    return;
  }
  show('wait', 'जाँच हो रही है...');
  foot.textContent = '';
  fetch(API_URL + '?id=' + encodeURIComponent(id))
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d && d.valid) {
        show('ok', '✔ Valid Certificate / प्रमाणित', [
          ['Name', d.name],
          ['Event', d.event],
          ['Date', d.date],
          ['Certificate ID', d.id],
          ['Issued by', d.issuer]
        ]);
        foot.textContent = 'सर्टिफिकेट पर छपा नाम इस नाम से मिलना चाहिए।';
      } else {
        show('bad', '✘ Invalid Certificate / अमान्य', null, 'यह सर्टिफिकेट हमारे रिकॉर्ड में नहीं मिला।');
        form.classList.remove('hidden');
      }
    })
    .catch(function () {
      show('wait', 'कनेक्शन में दिक्कत', null, 'इंटरनेट जाँचकर पेज दोबारा खोलें।');
    });
}

form.addEventListener('submit', function (e) {
  e.preventDefault();
  verify(box.value);
});

var params = new URLSearchParams(window.location.search);
verify(params.get('id'));
</script>
</body>
</html>
